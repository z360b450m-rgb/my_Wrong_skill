<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{CSP_NONCE}}'; style-src 'nonce-{{CSP_NONCE}}'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>教师错题分析报告</title>
  <style nonce="{{CSP_NONCE}}">
    :root{--ink:#162033;--muted:#667085;--line:#e4e7ec;--paper:#fff;--bg:#f4f7fb;--blue:#2457d6;--blue2:#e9efff;--red:#c7384f;--amber:#b56800;--green:#147a55;--shadow:0 10px 30px rgba(15,23,42,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.55}.page{max-width:1180px;margin:0 auto;padding:34px 24px 64px}.hero{background:linear-gradient(135deg,#173ea5,#3774e8);color:#fff;border-radius:22px;padding:30px 34px;box-shadow:var(--shadow)}
    h1{margin:0 0 6px;font-size:30px}.subtitle{opacity:.86}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn,.toolbar select{border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:9px 13px;font:inherit}.btn{cursor:pointer}.btn:hover{background:rgba(255,255,255,.23)}.toolbar select option{color:#111}.alert{margin:18px 0 0;padding:12px 15px;border-radius:12px;background:#fff3d6;color:#744400;font-weight:650}.alert.done{background:#eaf8f2;color:var(--green)}
    .metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:20px 0}.metric,.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.metric{padding:18px}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;font-size:26px;margin-top:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{padding:22px;margin:18px 0}.card h2{margin:0 0 15px;font-size:20px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.section-head .muted{font-size:13px}.table-wrap{overflow-x:auto}
    .bar-row{display:grid;grid-template-columns:minmax(130px,1.5fr) 3fr 96px;align-items:center;gap:10px;margin:12px 0}.bar-chart{display:block;width:100%;height:14px;overflow:visible}.bar-bg{fill:#eef1f6}.bar-fill{fill:#3974e8}.bar-fill.error{fill:#d95167}.bar-value{font-size:12px;color:var(--muted);white-space:nowrap}.bar-value b{color:var(--ink);font-size:14px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:650}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:var(--blue2);color:var(--blue);font-size:12px;margin:2px}.pill.red{background:#fff0f2;color:var(--red)}.pill.amber{background:#fff4db;color:var(--amber)}.pill.green{background:#eaf8f2;color:var(--green)}
    .review-note{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#f7f9fc;color:var(--muted);font-size:13px}.column-filter{display:grid;gap:5px;min-width:128px}.column-filter span{font-size:12px}.column-filter select{width:100%;border:1px solid #cbd3df;background:#fff;color:var(--ink);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;font-weight:500}.column-filter select:focus{outline:2px solid #b9c9ff;border-color:var(--blue)}.review-action{border:1px solid #b9c7e8;background:#fff;color:var(--blue);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}.review-action:hover{background:var(--blue2)}.review-action.done{border-color:#a9d6c5;background:#eaf8f2;color:var(--green)}.score-input{width:84px;border:1px solid #cbd3df;border-radius:8px;padding:7px 8px;font:inherit}.score-input:focus{outline:2px solid #b9c9ff;border-color:var(--blue)}tr.reviewed{background:#f7fbf9}.review-state{display:block;margin-top:4px;color:var(--green);font-size:12px;font-weight:650}.field-error{min-height:18px;color:var(--red);font-size:12px;margin-top:3px}.score-strong{font-size:16px;font-weight:750}.status-ready{color:var(--green);font-weight:700}.status-pending{color:var(--amber);font-weight:700}
    details{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#fff}summary{cursor:pointer;padding:14px 16px;font-weight:700}.detail-body{padding:0 16px 15px}.example{padding:12px;margin:10px 0;border-left:4px solid #7da2ff;background:#f7f9ff;border-radius:8px}.example p{margin:4px 0}.muted{color:var(--muted)}.actions li{margin:9px 0}.empty{color:var(--muted);padding:18px;text-align:center}.footer{color:var(--muted);font-size:12px;margin-top:24px}.hidden{display:none!important}
    @media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.page{padding:18px 12px}.hero{padding:24px 20px}.bar-row{grid-template-columns:1fr 2fr 48px}.section-head{display:block}}
    @media print{body{background:#fff}.page{max-width:none;padding:0}.hero{background:#fff!important;color:#111;border:1px solid #bbb;box-shadow:none}.toolbar,.review-action,.score-input,.field-error{display:none}.metric,.card{box-shadow:none;break-inside:avoid}.metrics{grid-template-columns:repeat(5,1fr)}details{break-inside:avoid}details>.detail-body{display:block!important}}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1 id="title">教师错题分析报告</h1>
      <div class="subtitle" id="meta"></div>
      <div class="toolbar">
        <button class="btn" id="print">打印 / 保存 PDF</button>
        <button class="btn" id="export-review">导出复核清单</button>
        <button class="btn" id="export-decisions">导出复核记录</button>
        <button class="btn" id="export-final">导出最终成绩</button>
        <select id="filter"><option value="all">全部题目</option><option value="errors">只看有错误</option><option value="review">只看待复核</option></select>
      </div>
      <div class="alert hidden" id="review-alert"></div>
    </section>
    <section class="metrics" id="metrics"></section>
    <section class="grid">
      <article class="card"><h2>薄弱知识点</h2><div id="knowledge"></div></article>
      <article class="card"><h2>主要错因</h2><div id="errors"></div></article>
    </section>
    <section class="card"><h2>优先讲解清单</h2><div id="priority"></div></section>
    <section class="card"><div class="section-head"><h2>学生情况</h2><span class="muted">按已评分得分率从低到高排列</span></div><div id="students"></div></section>
    <section class="card"><h2>典型错题证据</h2><div id="details"></div></section>
    <section class="card"><div class="section-head"><h2>待复核项目</h2><span class="muted">直接确认或修改分数，结果自动保存在当前浏览器</span></div><div id="review"></div></section>
    <section class="card"><div class="section-head"><h2>最终成绩</h2><span class="muted">随复核结果实时更新 · 按得分从低到高</span></div><div id="final-scores"></div></section>
    <section class="card"><h2>建议的教学行动</h2><ol class="actions" id="actions"></ol></section>
    <section class="footer" id="notes"></section>
  </main>
  <script nonce="{{CSP_NONCE}}">
    const DATA={{REPORT_DATA}};
    const STUDENT_BY_REF=new Map(DATA.student_summaries.map(student=>[student.student_ref,student]));
    const QUESTION_ORDER=new Map(DATA.priority_questions.map(question=>[question.question_id,question.number]));
    const DECISIONS=new Map();
    const REVIEW_FILTERS={student:'all',question:'all'};
    const STUDENT_FILTER={student:'all'};
    const STORAGE_KEY=`teacher-report-review:${DATA.organization_id}:${DATA.analysis_id}:${DATA.document_state_hash}:${DATA.view_schema_version}`;
    const el=id=>document.getElementById(id);
    const text=value=>value==null?'—':String(value);
    const esc=value=>text(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const reviewKey=item=>`${item.attempt_id}::${item.question_code}`;
    const round=value=>Math.round((Number(value)+Number.EPSILON)*100)/100;
    const scoreText=value=>Number.isInteger(Number(value))?String(Number(value)):String(round(value));
    const incorrectQuestions=studentRef=>(STUDENT_BY_REF.get(studentRef)||{}).incorrect_questions||[];
    const incorrectQuestionBadges=studentRef=>incorrectQuestions(studentRef).length?incorrectQuestions(studentRef).map(label=>`<span class="pill red">${esc(label)}</span>`).join(''):'无';
    function finalIncorrectQuestions(student){const questions=new Map((student.incorrect_question_codes||[]).map((code,index)=>[code,(student.incorrect_questions||[])[index]||code]));for(const item of DATA.review_items){if(item.student_ref!==student.student_ref)continue;const decision=DECISIONS.get(reviewKey(item));if(!decision)continue;const maximum=Number(item.max_score);if(Number.isFinite(maximum)&&Number(decision.score)>=maximum){questions.delete(item.question_code)}else{questions.set(item.question_code,item.question_id)}}return [...questions].sort((a,b)=>(QUESTION_ORDER.get(a[0])??10**9)-(QUESTION_ORDER.get(b[0])??10**9)||String(a[0]).localeCompare(String(b[0]))).map(entry=>entry[1])}

    function loadReviewState(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');for(const decision of saved){const item=DATA.review_items.find(row=>reviewKey(row)===decision.key);const score=Number(decision.score);if(item&&Number.isFinite(score)&&score>=0&&score<=Number(item.max_score)){const original=item.score==null?null:Number(item.score);DECISIONS.set(decision.key,{key:reviewKey(item),attempt_id:item.attempt_id,question_id:item.question_code,student_name:item.student_name,decision:original!==null&&score===original?'confirm':'modify',score:round(score),reason:original!==null&&score===original?'教师在报告中确认原分':'教师在报告中修改并确认分数',actor_ref:'teacher-report',reviewed_at:typeof decision.reviewed_at==='string'?decision.reviewed_at:new Date().toISOString()})}}}catch(_error){}}
    function saveReviewState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...DECISIONS.values()]))}catch(_error){}}
    function remainingReviewCount(){return Math.max(0,DATA.review_items.length-DECISIONS.size)}
    function metrics(){const m=DATA.metrics;const rows=[['学生数',DATA.student_count],['已评分作答',m.scored],['得分率',m.score_rate+'%'],['错误率',m.incorrect_rate+'%'],['待复核',remainingReviewCount()]];el('metrics').innerHTML=rows.map(row=>`<div class="metric"><span>${esc(row[0])}</span><strong>${esc(row[1])}</strong></div>`).join('')}
    function bars(id,rows,kind){const max=Math.max(1,...rows.map(row=>Number(row.count)||0));el(id).innerHTML=rows.length?rows.slice(0,8).map(row=>{const width=Math.max(0,Math.min(100,(Number(row.count)||0)/max*100));return `<div class="bar-row"><span title="${esc(row.name)}">${esc(row.name)}</span><svg class="bar-chart" viewBox="0 0 100 14" preserveAspectRatio="none" role="img" aria-label="${esc(row.name+'：'+row.count+'项，占'+row.percentage+'%')}"><rect class="bar-bg" x="0" y="0" width="100" height="14" rx="7"></rect><rect class="bar-fill${kind?' '+kind:''}" x="0" y="0" width="${width}" height="14" rx="7"></rect></svg><span class="bar-value"><b>${esc(row.count)}</b> 项 · ${esc(row.percentage)}%</span></div>`}).join(''):'<div class="empty">暂无稳定数据</div>'}
    function priority(){const rows=DATA.priority_questions;el('priority').innerHTML=`<div class="table-wrap"><table><thead><tr><th>优先级</th><th>题目</th><th>主要问题</th><th>错误人数</th><th>累计失分</th><th>待复核</th></tr></thead><tbody>${rows.map((question,index)=>`<tr data-errors="${question.incorrect}" data-review="${question.review_count}"><td>${index<3?'<span class="pill red">高</span>':'<span class="pill">常规</span>'}</td><td><b>${esc(question.label)}</b><div class="muted">${esc(question.question_text)}</div></td><td>${question.error_counts.length?question.error_counts.slice(0,2).map(item=>`<span class="pill amber">${esc(item.name)} × ${item.count}</span>`).join(''):'待补充'}</td><td>${question.incorrect} / ${question.responses}</td><td>${esc(question.lost_score)}</td><td>${question.review_count}</td></tr>`).join('')}</tbody></table></div>`}
    function studentFilterOptions(rows){return [...rows].sort((a,b)=>a.student_name.localeCompare(b.student_name,'zh-CN')).map(student=>`<option value="${esc(student.student_ref)}"${STUDENT_FILTER.student===student.student_ref?' selected':''}>${esc(student.student_name)}</option>`).join('')}
    function students(){const allRows=DATA.student_summaries;if(!allRows.length){el('students').innerHTML='<div class="empty">暂无学生统计</div>';return}const rows=STUDENT_FILTER.student==='all'?allRows:allRows.filter(student=>student.student_ref===STUDENT_FILTER.student);el('students').innerHTML=`<div class="table-wrap"><table><thead><tr><th><label class="column-filter"><span>学生姓名</span><select data-student-filter aria-label="筛选学生情况"><option value="all">全部学生</option>${studentFilterOptions(allRows)}</select></label></th><th>错题题号</th><th>已评分得分</th><th>得分率</th><th>作答情况</th><th>待复核</th><th>主要错因</th><th>薄弱知识点</th></tr></thead><tbody>${rows.map(student=>`<tr data-student-summary="${esc(student.student_ref)}"><td><b>${esc(student.student_name)}</b>${student.name_conflict?'<div class="pill amber">姓名需核对</div>':''}${student.attempt_count>1?`<div class="muted">${student.attempt_count} 次作答</div>`:''}</td><td>${incorrectQuestionBadges(student.student_ref)}</td><td>${esc(student.scored_score)} / ${esc(student.scored_max)}</td><td>${student.score_rate==null?'待评分':esc(student.score_rate)+'%'}</td><td>错题 ${student.incorrect_count}<div class="muted">未评分 ${student.unscored_count}</div></td><td>${student.review_count?`<span class="pill amber">${student.review_count} 项</span>`:'0'}</td><td>${student.main_errors.length?student.main_errors.map(name=>`<span class="pill red">${esc(name)}</span>`).join(''):'—'}</td><td>${student.weak_knowledge.length?student.weak_knowledge.map(name=>`<span class="pill">${esc(name)}</span>`).join(''):'—'}</td></tr>`).join('')}</tbody></table></div>`}
    function details(){el('details').innerHTML=DATA.priority_questions.map(question=>`<details data-errors="${question.incorrect}" data-review="${question.review_count}"><summary>${esc(question.label)} · 错误 ${question.incorrect}/${question.responses} · 失分 ${esc(question.lost_score)}</summary><div class="detail-body"><p>${esc(question.question_text)}</p><p>${question.knowledge.map(item=>`<span class="pill">${esc(item)}</span>`).join('')}</p>${question.examples.length?question.examples.map(example=>`<div class="example"><p><b>${esc(example.student_name)}</b>　得分：${esc(example.score)}　状态：${esc(example.review_status)}</p><p><b>观察：</b>${esc(example.observed)}</p><p><b>解释：</b>${esc(example.explanation)}</p><p>${example.error_tags.map(tag=>`<span class="pill red">${esc(tag)}</span>`).join('')}</p></div>`).join(''):'<div class="empty">暂无错误样例</div>'}</div></details>`).join('')}

    function reviewMatches(item){return (REVIEW_FILTERS.student==='all'||item.student_ref===REVIEW_FILTERS.student)&&(REVIEW_FILTERS.question==='all'||item.question_code===REVIEW_FILTERS.question)}
    function reviewOptions(rows,key,label){const options=new Map(rows.map(item=>[item[key],item[label]]));return [...options].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'zh-CN')).map(([value,name])=>`<option value="${esc(value)}"${REVIEW_FILTERS[key==='student_ref'?'student':'question']===value?' selected':''}>${esc(name)}</option>`).join('')}
    function review(){const rows=DATA.review_items;if(!rows.length){el('review').innerHTML='<div class="empty">没有待复核项目</div>';updateReviewAlert();return}const visibleCount=rows.filter(reviewMatches).length;const studentOptions=reviewOptions(rows,'student_ref','student_name');const questionOptions=reviewOptions(rows,'question_code','question_id');el('review').innerHTML=`<div class="review-note">可按学生姓名和题目组合筛选。输入教师确认后的分数并点击“确认分数”；刷新页面后仍会保留。</div><div class="table-wrap"><table><thead><tr><th><label class="column-filter"><span>学生姓名</span><select data-review-student-filter aria-label="按学生姓名筛选"><option value="all">全部学生</option>${studentOptions}</select></label></th><th><label class="column-filter"><span>题目</span><select data-review-question-filter aria-label="按题目筛选"><option value="all">全部题目</option>${questionOptions}</select></label></th><th>原分数</th><th>最终分数</th><th>原因</th><th>操作</th></tr></thead><tbody>${rows.map((item,index)=>{const key=reviewKey(item);const decision=DECISIONS.get(key);const classes=[decision?'reviewed':'',reviewMatches(item)?'':'hidden'].filter(Boolean).join(' ');return `<tr class="${classes}" data-review-student="${esc(item.student_ref)}" data-review-question="${esc(item.question_code)}"><td>${esc(item.student_name)}</td><td>${esc(item.question_id)}</td><td>${esc(item.score)} / ${esc(item.max_score)}</td><td>${decision?`<span class="score-strong">${esc(scoreText(decision.score))}</span>`:`<input class="score-input" type="number" min="0" max="${esc(item.max_score)}" step="0.01" value="${item.score==null?'':esc(item.score)}" data-review-score="${index}" aria-label="${esc(item.student_name+' '+item.question_id+'最终分数')}"><div class="field-error" data-review-error="${index}"></div>`}</td><td>${esc((item.reasons||[]).join('、'))}</td><td>${decision?`<button class="review-action done" data-review-undo="${index}">撤销确认</button><span class="review-state">${decision.decision==='modify'?'已修改并确认':'已确认原分'}</span>`:`<button class="review-action" data-review-confirm="${index}">确认分数</button>`}</td></tr>`}).join('')}${visibleCount?'':`<tr><td colspan="6" class="empty">当前筛选范围内没有待复核项目</td></tr>`}</tbody></table></div>`;updateReviewAlert()}
    function confirmReview(index){const item=DATA.review_items[index];const input=document.querySelector(`[data-review-score="${index}"]`);const error=document.querySelector(`[data-review-error="${index}"]`);if(!item||!input)return;const raw=input.value.trim();const score=Number(raw);if(raw===''||!Number.isFinite(score)||score<0||score>Number(item.max_score)){if(error)error.textContent=`请输入 0 到 ${item.max_score} 之间的分数`;input.focus();return}const original=item.score==null?null:Number(item.score);const decision={key:reviewKey(item),attempt_id:item.attempt_id,question_id:item.question_code,student_name:item.student_name,decision:original!==null&&score===original?'confirm':'modify',score:round(score),reason:original!==null&&score===original?'教师在报告中确认原分':'教师在报告中修改并确认分数',actor_ref:'teacher-report',reviewed_at:new Date().toISOString()};DECISIONS.set(decision.key,decision);saveReviewState();renderReviewResults()}
    function undoReview(index){const item=DATA.review_items[index];if(!item)return;DECISIONS.delete(reviewKey(item));saveReviewState();renderReviewResults()}

    function finalState(student){let score=Number(student.scored_score)||0;let maximum=Number(student.scored_max)||0;let unscored=Number(student.unscored_count)||0;let remaining=Number(student.review_count)||0;for(const item of DATA.review_items){if(item.student_ref!==student.student_ref)continue;const decision=DECISIONS.get(reviewKey(item));if(!decision)continue;remaining=Math.max(0,remaining-1);if(item.score==null){score+=Number(decision.score);maximum+=Number(item.max_score)||0;unscored=Math.max(0,unscored-1)}else{score+=Number(decision.score)-Number(item.score)}}const rate=maximum>0?round(score/maximum*100):null;return {student_ref:student.student_ref,student_name:student.student_name,incorrect_questions:finalIncorrectQuestions(student),score:round(score),maximum:round(maximum),rate,remaining,unscored,ready:remaining===0&&unscored===0}}
    function allFinalStates(){return DATA.student_summaries.map(finalState).sort((a,b)=>a.score-b.score||a.student_ref.localeCompare(b.student_ref))}
    function finalScores(){const rows=allFinalStates();el('final-scores').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>学生姓名</th><th>错题题号</th><th>复核后成绩</th><th>得分率</th><th>剩余待复核</th><th>发布状态</th></tr></thead><tbody>${rows.map(row=>`<tr><td><b>${esc(row.student_name)}</b></td><td>${row.incorrect_questions.length?row.incorrect_questions.map(label=>`<span class="pill red">${esc(label)}</span>`).join(''):'无'}</td><td><span class="score-strong">${esc(scoreText(row.score))} / ${esc(scoreText(row.maximum))}</span></td><td>${row.rate==null?'待评分':esc(row.rate)+'%'}</td><td>${row.remaining}</td><td class="${row.ready?'status-ready':'status-pending'}">${row.ready?'可发布':'暂不可发布'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">暂无最终成绩</div>'}
    function updateReviewAlert(){const alert=el('review-alert');const remaining=remainingReviewCount();alert.classList.remove('hidden','done');if(DATA.review_items.length===0||remaining===0){const ready=allFinalStates().every(row=>row.ready);alert.classList.add('done');alert.textContent=ready?'全部复核完成，最终成绩已可发布。':'复核项目已完成，但仍有未评分题目，最终成绩暂不可发布。'}else{alert.textContent=`已完成 ${DECISIONS.size} 项，剩余 ${remaining} 项待复核。`}}
    function renderReviewResults(){metrics();review();finalScores()}

    function actions(){el('actions').innerHTML=DATA.teaching_actions.map(item=>`<li>${esc(item)}</li>`).join('');el('notes').innerHTML=DATA.notes.map(item=>`<div>• ${esc(item)}</div>`).join('')}
    function applyFilter(){const value=el('filter').value;document.querySelectorAll('[data-errors]').forEach(node=>{const show=value==='all'||(value==='errors'&&+node.dataset.errors>0)||(value==='review'&&+node.dataset.review>0);node.classList.toggle('hidden',!show)})}
    function download(name,content,type){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([content],{type}));link.download=name;link.click();URL.revokeObjectURL(link.href)}
    function csvCell(value){const raw=text(value);return /^[\t\r\n ]*[=+\-@]/.test(raw)||/^[\t\r\n]/.test(raw)?"'"+raw:raw}
    function csv(rows){return '\ufeff'+rows.map(row=>row.map(value=>'"'+csvCell(value).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
    function exportReviewCsv(){const head=['学生姓名','题目','原分数','满分','最终分数','复核状态','原因'];const rows=DATA.review_items.map(item=>{const decision=DECISIONS.get(reviewKey(item));return [item.student_name,item.question_id,item.score,item.max_score,decision?decision.score:'',decision?(decision.decision==='modify'?'已修改并确认':'已确认原分'):'待复核',(item.reasons||[]).join('|')]});download('复核清单.csv',csv([head,...rows]),'text/csv;charset=utf-8')}
    function exportDecisions(){const payload={organization_id:DATA.organization_id,analysis_id:DATA.analysis_id,document_state_hash:DATA.document_state_hash,exported_at:new Date().toISOString(),decisions:[...DECISIONS.values()].sort((a,b)=>a.key.localeCompare(b.key))};download('复核记录.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8')}
    function exportFinal(){const rows=allFinalStates();const head=['学生姓名','错题题号','最终得分','总分','得分率','剩余待复核','未评分题','发布状态'];download('最终成绩.csv',csv([head,...rows.map(row=>[row.student_name,row.incorrect_questions.join('、')||'无',row.score,row.maximum,row.rate==null?'':row.rate+'%',row.remaining,row.unscored,row.ready?'可发布':'暂不可发布'])]),'text/csv;charset=utf-8')}

    loadReviewState();
    el('meta').textContent=`${text(DATA.grade)} · ${text(DATA.subject)} · ${DATA.student_count} 名学生 · 分析编号 ${text(DATA.analysis_id)}`;
    metrics();bars('knowledge',DATA.knowledge_distribution,'');bars('errors',DATA.error_distribution,'error');priority();students();details();review();finalScores();actions();
    el('review').addEventListener('click',event=>{const confirm=event.target.closest('[data-review-confirm]');const undo=event.target.closest('[data-review-undo]');if(confirm)confirmReview(Number(confirm.dataset.reviewConfirm));if(undo)undoReview(Number(undo.dataset.reviewUndo))});
    el('review').addEventListener('change',event=>{if(event.target.matches('[data-review-student-filter]')){REVIEW_FILTERS.student=event.target.value;review()}if(event.target.matches('[data-review-question-filter]')){REVIEW_FILTERS.question=event.target.value;review()}});
    el('students').addEventListener('change',event=>{if(event.target.matches('[data-student-filter]')){STUDENT_FILTER.student=event.target.value;students()}});
    el('filter').addEventListener('change',applyFilter);el('print').addEventListener('click',()=>window.print());el('export-review').addEventListener('click',exportReviewCsv);el('export-decisions').addEventListener('click',exportDecisions);el('export-final').addEventListener('click',exportFinal);
  </script>
</body>
