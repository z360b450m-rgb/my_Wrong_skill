<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{CSP_NONCE}}'; style-src 'nonce-{{CSP_NONCE}}'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>错题关系星图</title>
  <style nonce="{{CSP_NONCE}}">
    *{box-sizing:border-box}body{margin:0;background:#08111f;color:#e8eef8;font:14px system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;background:#101c2f;border-bottom:1px solid #243551}
    h1{font-size:18px;margin:0 18px 0 0}label{color:#aebbd0}select,input{margin-left:6px;padding:7px 9px;border:1px solid #344867;border-radius:7px;background:#0c1728;color:#fff}
    #wrap{position:relative;height:calc(100vh - 66px)}canvas{display:block;width:100%;height:100%}
    #tip{display:none;position:absolute;max-width:330px;padding:10px 12px;border:1px solid #40577b;border-radius:9px;background:#101c2ff2;color:#fff;pointer-events:none;box-shadow:0 8px 25px #0008}
    #legend{position:absolute;right:16px;bottom:16px;padding:11px 13px;background:#101c2fdd;border:1px solid #344867;border-radius:9px;color:#c8d4e8}
  </style>
</head>
<body>
  <header>
    <h1>错题关系星图</h1>
    <label>知识点<select id="group"><option value="">全部</option></select></label>
    <label>复核<select id="review"><option value="all">全部</option><option value="needs">待复核</option><option value="confirmed">已确认</option></select></label>
    <label>搜索<input id="search" type="search" maxlength="80" placeholder="题号或知识点"></label>
  </header>
  <div id="wrap"><canvas id="map"></canvas><div id="tip"></div><div id="legend">节点大小＝累计失分<br>连线＝题目关系相似度</div></div>
  <script nonce="{{CSP_NONCE}}">
  "use strict";
  const graph={{GRAPH_JSON}};
  const canvas=document.getElementById("map"),ctx=canvas.getContext("2d"),tip=document.getElementById("tip");
  const group=document.getElementById("group"),review=document.getElementById("review"),search=document.getElementById("search");
  const palette=["#58a6ff","#f2cc60","#7ee787","#d2a8ff","#ff7b72","#79c0ff","#ffa657","#a5d6ff"];
  const colors=new Map();graph.filters.group.forEach((name,i)=>{colors.set(name,palette[i%palette.length]);const option=document.createElement("option");option.value=name;option.textContent=name;group.appendChild(option)});
  let nodes=[],edges=[],hover=null;
  function hash(text){let h=graph.layout_seed>>>0;for(let i=0;i<text.length;i++)h=Math.imul(h^text.charCodeAt(i),16777619);return h>>>0}
  function filtered(){const q=search.value.trim().toLowerCase();nodes=graph.nodes.filter(n=>(!group.value||n.group===group.value)&&(review.value==="all"||(review.value==="needs"?n.review_count>0:n.review_count===0))&&(!q||(n.id+" "+n.group).toLowerCase().includes(q)));const ids=new Set(nodes.map(n=>n.id));edges=graph.edges.filter(e=>ids.has(e.source)&&ids.has(e.target))}
  function resize(){const rect=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);layout();draw()}
  function layout(){filtered();const w=canvas.clientWidth,h=canvas.clientHeight,cx=w/2,cy=h/2,r=Math.max(80,Math.min(w,h)*.38);nodes.forEach((n,i)=>{const angle=(hash(n.id)%10000)/10000*Math.PI*2+i/nodes.length*.35;n.x=cx+Math.cos(angle)*r*(.45+(hash(n.group)%50)/100);n.y=cy+Math.sin(angle)*r*(.45+(hash(n.id+"y")%50)/100);n.radius=Math.max(5,Math.min(22,Math.sqrt(n.size)*1.6))})}
  function draw(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);const byId=new Map(nodes.map(n=>[n.id,n]));ctx.lineWidth=1;edges.forEach(e=>{const a=byId.get(e.source),b=byId.get(e.target);if(!a||!b)return;ctx.strokeStyle=`rgba(112,148,196,${Math.max(.08,Math.min(.65,e.weight))})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});nodes.forEach(n=>{ctx.fillStyle=colors.get(n.group)||"#8b949e";ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=n===hover?18:8;ctx.beginPath();ctx.arc(n.x,n.y,n.radius+(n===hover?2:0),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#e8eef8";ctx.font="12px system-ui";ctx.textAlign="center";ctx.fillText(n.label,n.x,n.y+n.radius+15)})}
  canvas.addEventListener("mousemove",event=>{const rect=canvas.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;hover=nodes.find(n=>Math.hypot(n.x-x,n.y-y)<=n.radius+5)||null;if(hover){const rate=hover.correct_rate===null?"未评分":`${hover.correct_rate}%`;tip.style.display="block";tip.style.left=Math.min(rect.width-340,x+14)+"px";tip.style.top=Math.max(8,y-10)+"px";tip.textContent=`${hover.id}｜${hover.group}｜正确率 ${rate}｜失分 ${hover.lost_score}｜待复核 ${hover.review_count}`}else tip.style.display="none";draw()});
  [group,review,search].forEach(el=>el.addEventListener(el===search?"input":"change",()=>{layout();draw()}));addEventListener("resize",resize);resize();
  </script>
</body>
</html>
